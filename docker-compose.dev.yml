version: '3.8'

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8 --encoding=UTF8"
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"

  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - DEV_MODE=true
    container_name: markhor_php
    environment:
      APP_ENV: development
      DEBUG: "true"
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-farmos}
      DB_USER: ${DB_USER:-farmos}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - .:/opt/drupal
      - php_vendor:/opt/drupal/vendor
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: markhor_nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/opt/drupal:ro
      - ./docker/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - farmos_network

  adminer:
    image: adminer:latest
    container_name: markhor_adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
    networks:
      - farmos_network
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  mailhog:
    image: mailhog/mailhog:latest
    container_name: markhor_mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - farmos_network

networks:
  farmos_network:
    driver: bridge

volumes:
  php_vendor:
    driver: local
