server {
    listen 80 default_server;
    server_name markhorconsultants.com www.markhorconsultants.com;

    root /opt/drupal/web;
    index index.php index.html;

    # Production logging (less verbose)
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline'" always;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup/config files
    location ~ \.(conf|swp|sql|bak|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Support clean URLs (Drupal)
    location ~ ^/system/files/ {
        try_files $uri @rewrite;
    }

    # Static file caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?q=$1 last;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DRUPAL_ENV production;
        fastcgi_read_timeout 60s;

        # Production buffer settings
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_buffering on;

        # Connection settings
        fastcgi_keep_conn on;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Drupal robots.txt
    location = /robots.txt {
        try_files $uri =404;
    }

    # Drupal sitemap.xml
    location = /sitemap.xml {
        try_files $uri =404;
    }
}
