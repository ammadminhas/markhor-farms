[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.allowed_clients = 127.0.0.1,nginx
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500
catch_workers_output = yes
clear_env = no
env[DRUPAL_ENV] = ${DRUPAL_ENVIRONMENT}
env[APP_ENV] = ${APP_ENV}

; Log settings
access.log = /var/log/fpm-access.log
access.format = "%R - %u %t \"%m %r\" %s %l %Q%^[%{mtime}d]"

; Slowlog
slowlog = /var/log/fpm-slow.log
request_slowlog_timeout = 10s
