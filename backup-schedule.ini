[global]
logfile = /var/log/ofelia/ofelia.log
loglevel = info

# Main database backup job
[job "backup-job"]
schedule = @daily
container = markhor_backup
command = /usr/local/bin/backup.sh

# Database backup job (twice daily)
[job "backup-job-noon"]
schedule = 0 12 * * *
container = markhor_backup
command = /usr/local/bin/backup.sh

# Cleanup old backups (weekly)
[job "cleanup-job"]
schedule = 0 3 * * 0
container = markhor_backup
command = /usr/local/bin/cleanup-backups.sh

# Health check (every 6 hours)
[job "health-check"]
schedule = 0 */6 * * *
container = markhor_postgres
command = pg_isready -U farmos
