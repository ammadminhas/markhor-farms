version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: markhor_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-farmos}
      POSTGRES_USER: ${DB_USER:-farmos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8 --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-farmos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - farmos_network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: markhor_php
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DRIVER: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-farmos}
      DB_USER: ${DB_USER:-farmos}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      FARMOS_SITE_NAME: ${FARMOS_SITE_NAME:-Markhor Farms}
      FARMOS_ADMIN_EMAIL: ${FARMOS_ADMIN_EMAIL:-admin@markhorconsultants.com}
      FARMOS_ADMIN_USER: ${FARMOS_ADMIN_USER:-admin}
      FARMOS_ADMIN_PASSWORD: ${FARMOS_ADMIN_PASSWORD:-changeme}
      HASH_SALT: ${HASH_SALT:-randomly-generated-hash}
    volumes:
      - ./web:/opt/drupal/web
      - ./profiles:/opt/drupal/web/profiles
      - ./themes:/opt/drupal/web/themes
      - ./modules/custom:/opt/drupal/web/modules/custom
      - php_vendor:/opt/drupal/vendor
      - php_cache:/opt/drupal/web/sites/default/files
    ports:
      - "${PHP_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - farmos_network

  nginx:
    image: nginx:alpine
    container_name: markhor_nginx
    depends_on:
      - php
    volumes:
      - ./web:/opt/drupal/web:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - farmos_network

volumes:
  postgres_data:
    driver: local
  php_vendor:
    driver: local
  php_cache:
    driver: local

networks:
  farmos_network:
    driver: bridge
